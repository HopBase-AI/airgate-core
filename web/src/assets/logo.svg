<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="HopBase">
  <defs>
    <linearGradient id="hb-bg" x1="40" y1="20" x2="472" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d35800"/>
      <stop offset="52%" stop-color="#c45100"/>
      <stop offset="100%" stop-color="#9c3f00"/>
    </linearGradient>
    <radialGradient id="hb-sheen" cx="0.76" cy="0.18" r="0.95">
      <stop offset="0%" stop-color="#ffd0b3" stop-opacity="0.55"/>
      <stop offset="42%" stop-color="#ffb594" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffb594" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角方块底 -->
  <rect width="512" height="512" rx="116" fill="url(#hb-bg)"/>
  <!-- 右上角高光 -->
  <rect width="512" height="512" rx="116" fill="url(#hb-sheen)"/>

  <!-- H 拱门字母标：两竖柱 + 上拱横梁（Gate / Hop） -->
  <g stroke="#ffffff" stroke-width="46" stroke-linecap="round" fill="none">
    <path d="M174 150 V362"/>
    <path d="M338 150 V362"/>
    <path d="M174 258 Q256 168 338 258"/>
  </g>
</svg>
